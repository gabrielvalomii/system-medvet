<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Dashboard — Finanças</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <script src="/vendor/chart.js/chart.umd.min.js" defer></script>
    <script type="module" src="/js/dashboard.js"></script>
  </head>
  <body data-auth="pending">
    <a class="skip-link" href="#main">Pular para o conteúdo</a>
    <div class="app">
      <aside class="sidebar" id="sidebar" aria-label="Navegação">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 3v18h18" />
              <path d="m7 15 4-4 3 3 6-6" />
            </svg>
          </span>
          Finanças
          <button
            class="btn btn-secondary btn-icon sidebar-close"
            id="sidebar-close"
            type="button"
            aria-controls="sidebar"
            aria-label="Fechar menu"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg>
          </button>
        </div>
        <nav aria-label="Menu principal">
          <ul class="nav-list">
            <li>
              <a class="nav-link" href="/dashboard.html" aria-current="page" data-keep-month>
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <rect x="3" y="3" width="7" height="9" rx="1" />
                  <rect x="14" y="3" width="7" height="5" rx="1" />
                  <rect x="14" y="12" width="7" height="9" rx="1" />
                  <rect x="3" y="16" width="7" height="5" rx="1" />
                </svg>
                Dashboard
              </a>
            </li>
            <li>
              <a class="nav-link" href="/gastos.html" data-keep-month>
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <circle cx="12" cy="12" r="9" />
                  <path d="M8 12h8" />
                </svg>
                Adicionar gastos
              </a>
            </li>
            <li>
              <a class="nav-link" href="/rendimentos.html" data-keep-month>
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <circle cx="12" cy="12" r="9" />
                  <path d="M8 12h8M12 8v8" />
                </svg>
                Adicionar rendimentos
              </a>
            </li>
          </ul>
        </nav>
        <button class="nav-link logout" id="logout-button" type="button">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <path d="m16 17 5-5-5-5" />
            <path d="M21 12H9" />
          </svg>
          Sair
        </button>
      </aside>
      <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>

      <div class="app-main">
        <header class="topbar">
          <button
            class="btn btn-secondary btn-icon menu-toggle"
            id="menu-toggle"
            type="button"
            aria-controls="sidebar"
            aria-expanded="false"
            aria-label="Abrir menu"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <path d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
          <h1>Dashboard</h1>
          <div class="topbar-actions">
            <div class="month-picker" role="group" aria-label="Período">
              <button
                class="btn btn-ghost btn-icon"
                id="month-prev"
                type="button"
                aria-label="Mês anterior"
              >
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  aria-hidden="true"
                >
                  <path d="m15 18-6-6 6-6" />
                </svg>
              </button>
              <label class="visually-hidden" for="month-input">Mês</label>
              <input class="input" id="month-input" type="month" min="2000-01" />
              <button
                class="btn btn-ghost btn-icon"
                id="month-next"
                type="button"
                aria-label="Próximo mês"
              >
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  aria-hidden="true"
                >
                  <path d="m9 18 6-6-6-6" />
                </svg>
              </button>
            </div>
            <div class="user-chip">
              <span class="avatar" id="user-avatar" aria-hidden="true"></span>
              <span id="user-name"></span>
            </div>
          </div>
        </header>

        <main class="content" id="main" tabindex="-1">
          <p class="muted">Resumo de <strong id="period-label"></strong></p>
          <p class="visually-hidden" id="dashboard-status" aria-live="polite"></p>

          <section class="summary-grid" id="summary" aria-label="Resumo do mês">
            <article class="summary-card is-expense">
              <h2 class="summary-label">Total de gastos</h2>
              <p class="summary-value" id="total-expenses">—</p>
            </article>
            <article class="summary-card is-income">
              <h2 class="summary-label">Total de ganhos</h2>
              <p class="summary-value" id="total-incomes">—</p>
            </article>
            <article class="summary-card is-balance">
              <h2 class="summary-label">Saldo do período</h2>
              <p class="summary-value" id="balance">—</p>
            </article>
          </section>

          <section class="charts-grid" aria-label="Gráficos por categoria">
            <article class="panel" aria-labelledby="expenses-title">
              <div class="panel-header">
                <h2 id="expenses-title">Gastos por categoria</h2>
              </div>
              <div id="expenses-state"></div>
              <div class="chart-content" id="expenses-content" hidden>
                <div class="chart-box">
                  <canvas
                    id="expenses-chart"
                    role="img"
                    aria-label="Gráfico de gastos por categoria"
                  ></canvas>
                  <div class="chart-total" aria-hidden="true">
                    <small>Total</small>
                    <strong id="expenses-chart-total"></strong>
                  </div>
                </div>
                <ul
                  class="category-list"
                  id="expenses-list"
                  aria-label="Gastos por categoria: valor e porcentagem"
                ></ul>
              </div>
            </article>

            <article class="panel" aria-labelledby="incomes-title">
              <div class="panel-header">
                <h2 id="incomes-title">Ganhos por categoria</h2>
              </div>
              <div id="incomes-state"></div>
              <div class="chart-content" id="incomes-content" hidden>
                <div class="chart-box">
                  <canvas
                    id="incomes-chart"
                    role="img"
                    aria-label="Gráfico de ganhos por categoria"
                  ></canvas>
                  <div class="chart-total" aria-hidden="true">
                    <small>Total</small>
                    <strong id="incomes-chart-total"></strong>
                  </div>
                </div>
                <ul
                  class="category-list"
                  id="incomes-list"
                  aria-label="Ganhos por categoria: valor e porcentagem"
                ></ul>
              </div>
            </article>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
