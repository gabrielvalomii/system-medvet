[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = "venv"

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["venv", "*/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "S", "C4", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]

[tool.coverage.run]
source = ["."]
omit = ["venv/*", "*/migrations/*", "manage.py", "config/asgi.py", "config/wsgi.py", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
